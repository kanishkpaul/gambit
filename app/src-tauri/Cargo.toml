[package]
name = "gambit"
version = "0.5.0"
description = "gambit: a personal chess tutor"
authors = ["Kanishk Paul"]
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "gambit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
window-vibrancy = "0.7"
keyring = { version = "3", features = ["apple-native"] }
