[project]
name = "gambit-brain"
version = "0.1.0"
description = "gambit's brain: chess logic, engines, storage and integrations"
requires-python = "==3.12.*"
dependencies = [
  "chess==1.11.2",
  "websockets>=17",
  "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
gambit-brain = "gambit_brain.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gambit_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM102", "SIM105", "SIM113"]
