[project]
name = "gambit-brain"
version = "0.1.0"
description = "gambit's brain: chess logic, engines, storage and integrations"
requires-python = "==3.12.*"
dependencies = [
  "chess==1.11.2",
  "websockets>=17",
  "httpx>=0.28",
  "fsrs>=6.3.2",
  "zstandard>=0.25.0",
  "maia3",
  "torch>=2.15.0",
  "numpy>=2.5.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
gambit-brain = "gambit_brain.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gambit_brain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM102", "SIM105", "SIM113"]

[tool.uv.sources]
maia3 = { git = "https://github.com/CSSLab/maia3", rev = "1e13597c42d4858b7cfd7cfdae01e297263364b2" }
