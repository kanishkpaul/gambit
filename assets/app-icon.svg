    <linearGradient id="glass" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.6" stop-color="#E4EEEA"/><stop offset="1" stop-color="#A9BDB7"/></linearGradient>
