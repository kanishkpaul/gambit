<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- gambit app icon: a faceted knight on deep green. -->
  <defs>
    <path id="sq" d="M100 285.4C100 182.9 182.9 100 285.4 100H738.6C841.1 100 924 182.9 924 285.4V738.6C924 841.1 841.1 924 738.6 924H285.4C182.9 924 100 841.1 100 738.6Z"/> <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/></filter>
    <clipPath id="clip"><use href="#sq"/></clipPath>
